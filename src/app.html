<!doctype html>
<html lang="pt-BR" data-theme="sumi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0e0b0a" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/icons/marca/ic-marca-32.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700;800&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+JP:wght@700;800&family=Pixelify+Sans:wght@400;500;600;700&display=swap"
		/>
		<script>
			// Aplica tema e tamanho de leitura antes da primeira pintura (sem piscar).
			try {
				var d = document.documentElement;
				var t = localStorage.getItem('snm:tema');
				if (t === 'sistema') t = matchMedia('(prefers-color-scheme: light)').matches ? 'washi' : 'sumi';
				d.dataset.theme = t === 'washi' ? 'washi' : 'sumi';
				var l = localStorage.getItem('snm:leitura');
				if (l) d.dataset.leitura = l;
				var v = JSON.parse(localStorage.getItem('snm:visual-css') || '{}');
				for (var k in v) if (/^--[a-z0-9-]+$/.test(k)) d.style.setProperty(k, String(v[k]));
				if (v['--raio']) d.dataset.raio = '';
				if (v['--escala']) d.dataset.escala = '';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
