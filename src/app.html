<!doctype html>
<html lang="pt-BR" data-theme="sumi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0e0b0a" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/icons/marca/ic-marca-32.png" />
		<!-- fontes locais (src/routes/fontes.css, scripts/fontes/baixar.ts): as da primeira tela já vêm pré-carregadas -->
		<link rel="preload" href="%sveltekit.assets%/fonts/google/noto-sans-latin-normal-400.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<link rel="preload" href="%sveltekit.assets%/fonts/google/pixelify-sans-latin-normal-400.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<link rel="preload" href="%sveltekit.assets%/fonts/google/shippori-mincho-b1-latin-normal-700.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<link rel="preload" href="%sveltekit.assets%/fonts/digitos-shinobi.otf" as="font" type="font/otf" crossorigin="anonymous" />
		<script>
			// Aplica tema e tamanho de leitura antes da primeira pintura (sem piscar).
			try {
				var d = document.documentElement;
				var t = localStorage.getItem('snm:tema');
				if (t === 'sistema') t = matchMedia('(prefers-color-scheme: light)').matches ? 'washi' : 'sumi';
				d.dataset.theme = t === 'washi' ? 'washi' : 'sumi';
				var l = localStorage.getItem('snm:leitura');
				if (l) d.dataset.leitura = l;
				var v = JSON.parse(localStorage.getItem('snm:visual-css') || '{}');
				for (var k in v) if (/^--[a-z0-9-]+$/.test(k)) d.style.setProperty(k, String(v[k]));
				if (v['--raio']) d.dataset.raio = '';
				if (v['--escala']) d.dataset.escala = '';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
