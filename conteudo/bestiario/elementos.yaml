- slug: especialista-jinton
  nome: Especialista em Jinton
  tipo: shinobi
  origem: Os Tsuchikage de Iwa
  vila: null
  arte: { formato: pagina, plano: aéreo }
  cena:
    - "Entre as palmas do velho surge um cubo pequeno, de luz branca, com uma esfera girando no meio. Parece um brinquedo. Ele o solta no ar, e o cubo cresce de repente até engolir a torre inteira, e a torre não cai: simplesmente não está mais lá."
  descricao:
    - "A Poeira junta a terra, o vento e o fogo, e é a única Kekkei Tōta que o mundo conhece. Tudo o que fica dentro de um jutsu de Jinton vira pó, de carne a montanha, sem fogo e sem barulho. Quem tem esse sangue aprende antes a tornar o próprio corpo leve ou pesado, e voa sobre o campo de batalha como uma pedra que esqueceu de cair."
    - "A Poeira é Kekkei Tōta: três elementos juntos (Elementos combinados, cap. 10), criada com as regras de Kekkei Genkai do cap. 8 e só com a aprovação do Mestre. Ela sobe dois pontos de ameaça, em vez de um. Em Iwa, esse sangue passou de Tsuchikage para Tsuchikage."
  estagios:
    - nome: Genin
      arte: { formato: retrato, plano: de baixo }
      ameaca: 4
      papel: atirador
      perfil: equilibrado
      estilo: vigilante
      resumo: "Saída da Academia há pouco, ainda flutua sem querer quando fica feliz demais."
      ataques:
        - { nome: Bala de pedra, alcance: Médio }
      jutsus:
        - { slug: doryuudan }
        - { slug: daitoppa }
        - { slug: goukakyu-no-jutsu }
      tracos:
        - &jinton-pedra-leve { nome: Pedra leve, efeito: "Como ação secundária, fica leve o bastante para flutuar até o fim do turno; voando, ataques corpo a corpo contra ele têm desvantagem." }
