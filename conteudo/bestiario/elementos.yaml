      resumo: "Agente de elite que toca o alvo uma vez só, e não precisa de uma segunda."
      ataques:
        - { nome: Toque que seca, alcance: Corpo a corpo, efeito: "Dano em dobro contra alvo **Desprevenido**." }
      jutsus:
        - { slug: shakuton-daijohappa }
        - { slug: shakuton-kajosatsu }
        - { slug: kaze-no-yaiba }
        - { slug: shunshin-no-jutsu }
      tracos:
        - *shakuton-esferas-de-calor
        - *shakuton-secura
    - nome: Nível Kage
