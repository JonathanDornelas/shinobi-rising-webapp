    - "A combinação de Fogo e Vento é Kekkei Genkai (cap. 8), e as regras dela estão em Elementos combinados (cap. 10). O sangue do Calor é de Suna, e as vilas vizinhas costumam tratar quem o tem como arma de guerra."
