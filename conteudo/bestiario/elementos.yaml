    - "A combinação de Vento e Terra é Kekkei Genkai (cap. 8), e as regras dela estão em Elementos combinados (cap. 10). O Magnetismo é o sangue da linhagem Sabaku de Suna, que já deu mais de um Kazekage. Para o clã inteiro, veja Sabaku."
  estagios:
    - nome: Genin
      arte: { formato: retrato, plano: de cima }
      ameaca: 3
      papel: atirador
      perfil: equilibrado
      estilo: vigilante
      resumo: "Saída da Academia há pouco, ainda atrai todos os talheres da mesa quando fica nervosa."
      ataques:
        - { nome: Agulhas de ferro, alcance: Médio }
      jutsus:
        - { slug: sakin-shigure }
        - { slug: daitoppa }
        - { slug: doryuudan }
      tracos:
