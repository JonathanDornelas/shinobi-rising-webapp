        - &ranton-olho-da-tempestade { nome: Olho da tempestade, efeito: "Uma vez por cena, como ação primária, cada inimigo a até 30 m que ele consiga ver resiste com AGI contra a DT da ficha ou sofre o dano da ficha em dobro, atingido por um feixe que vem de cima." }
