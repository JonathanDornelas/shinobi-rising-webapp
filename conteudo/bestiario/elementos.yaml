      arte: { formato: quadro, plano: câmera inclinada }
      ameaca: 7
      papel: controlador
      perfil: chakra-farto
      estilo: calculista
      resumo: "Deixa o inimigo pesado demais para levantar e conversa com ele de cima, flutuando."
      ataques:
