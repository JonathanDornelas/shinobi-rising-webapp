# Bestiário · feras: a fauna comum e gigante do mundo shinobi. Fauna não tem chakra (PC "—").
# As que crescem (lobos, centopeias, aranhas) têm estágios. Formato: veja o cabeçalho de shinobi.yaml.
- slug: lobos
  nome: Lobos das montanhas
  tipo: fauna
  origem: País da Neve e montanhas do norte
  vila: null
  arte: { formato: faixa, plano: plano aberto }
  cena:
    - "Os uivos começam longe e vão chegando de lados diferentes. Na neve, entre os pinheiros, aparecem olhos amarelos, depois mais, depois a fumaça da respiração de muitos bichos ao mesmo tempo."
  descricao:
    - "Nas montanhas frias, onde a caça é pouca, os lobos andam em alcateia e não perdem tempo com presa forte. Cercam, cansam e derrubam o mais fraco do grupo. Os mais velhos crescem até o tamanho de um cavalo, e toda alcateia antiga tem um líder que já provou sangue de ninja."
  estagios:
    - nome: Alcateia
      ameaca: 1/2
      papel: bando
      membros: 4
      resumo: "Lobos comuns, que caçam juntos."
      nota: "Ficha de cada lobo; a alcateia age na mesma iniciativa."
      ataques:
        - { nome: Mordida, alcance: Corpo a corpo, efeito: "O alvo resiste com FOR contra a DT 12 ou fica **Caído**." }
      tracos:
        - { nome: Caça em grupo, efeito: "Ataques contra um alvo que já foi mordido nesta rodada têm vantagem." }
        - { nome: Debandada, efeito: "Quando metade da alcateia cai, o resto foge." }
    - nome: Lobo gigante
      ameaca: 3
      papel: lutador
      resumo: "Do tamanho de um cavalo, derruba um homem com o peso."
      ataques:
        - { nome: Mordida, alcance: Corpo a corpo, efeito: "O alvo resiste com FOR contra a DT 13 ou fica **Caído**." }
      tracos:
        - { nome: Faro, efeito: "Tem vantagem em Rastreamento e em Percepção pelo cheiro." }
    - nome: Líder da alcateia
      ameaca: 6
      papel: chefe
      resumo: "Branco de velho, cheio de cicatrizes de kunai, e a alcateia faz o que ele manda."
      ataques:
        - { nome: Mordida do líder, alcance: Corpo a corpo, efeito: "O alvo resiste com FOR contra a DT 15 ou fica **Caído** e **Imobilizado**." }
      tracos:
        - { nome: Uivo, efeito: "Uma vez por cena, uiva: a alcateia ganha vantagem nos ataques até o fim da rodada, e quem não for ninja fica **Amedrontado**." }
  taticas:
    - "Cercam o personagem mais isolado e mordem até ele cair. Não atacam quem está de costas para uma parede ou para uma fogueira."
  ganchos:
    - "Os lobos estão descendo para os vilarejos porque fogem de alguma coisa maior na montanha."
    - "Um deles tem uma coleira de clã Inuzuka."
  tags: [Agressivo, Covarde]

- slug: centopeias-gigantes
  nome: Centopeias da Floresta da Morte
  tipo: fauna
  origem: Floresta da Morte (Área de Treino 44)
  vila: null
  arte: { formato: faixa, plano: corpo inteiro }
  cena:
    - "O tronco em que o genin se apoia se mexe. Não é casca: são placas, uma atrás da outra, e embaixo delas um mar de patas se desenrolando. Quando as pinças se abrem, ele entende por que ninguém acampa perto das raízes."
  descricao:
    - "A Floresta da Morte cria feras grandes demais, e as centopeias estão entre as piores. Vivem enroladas nas raízes das árvores gigantes, imóveis por horas, e atacam o que passa perto. O veneno das pinças não mata depressa: deixa a vítima lenta o bastante para ser arrastada até o ninho, onde a matriarca espera."
  estagios:
    - nome: Centopeia
      ameaca: 2
      papel: lutador
      resumo: "Do comprimento de um homem, esconde-se sob as folhas."
      ataques:
        - { nome: Pinças, alcance: Corpo a corpo, efeito: "O alvo resiste com VIG contra a DT 13 ou sofre o Veneno Comum (cap. 11)." }
    - nome: Centopeia gigante
      ameaca: 6
      papel: lutador
      resumo: "Grossa como um tronco, enrola o corpo em volta da presa."
      rd: 2
      ataques:
        - { nome: Pinças, alcance: Corpo a corpo, efeito: "O alvo resiste com VIG contra a DT 15 ou fica **Envenenado** (1d4 de dano por turno, por 3 turnos, como o Veneno Comum do cap. 11)." }
      tracos:
        - { nome: Carapaça, efeito: "RD 2." }
        - { nome: Enrolar, efeito: "Quando as pinças acertam, pode enrolar o corpo no alvo, que fica **Imobilizado** até se libertar com uma Resistência de FOR contra a DT 15." }
        - { nome: Muitas patas, efeito: "Sobe troncos e anda de cabeça para baixo nos galhos como se fosse chão. Nunca fica **Caído**." }
    - nome: Matriarca do ninho
      ameaca: 10
      papel: chefe
      resumo: "Tão longa que dá a volta numa árvore gigante, e cada patada racha a casca."
      rd: 3
      ataques:
        - { nome: Pinças da matriarca, alcance: Curto, efeito: "O alvo resiste com VIG contra a DT 17 ou sofre o Veneno Forte (cap. 11)." }
      tracos:
        - { nome: Carapaça antiga, efeito: "RD 3." }
        - { nome: Ninhada, efeito: "Uma vez por cena, chama a ninhada: aparecem três centopeias, que agem na iniciativa dela." }
  taticas:
    - "Esperam enroladas nas raízes e atacam quem passa embaixo, de preferência o último da fila. Prendem a presa e tentam arrastá-la para o meio das raízes."
    - "São animais: abaixo de um quarto dos PV, soltam a presa e fogem para o ninho. A matriarca nunca sai dele."
  ganchos:
    - "O ninho fica bem no caminho até a torre do centro da floresta, e há outra equipe presa lá dentro."
    - "Um mercador de venenos paga caro pelas glândulas das pinças, inteiras."
  tags: [Agressivo, Covarde]

- slug: aranhas-gigantes
  nome: Aranhas gigantes
  tipo: fauna
  origem: Cavernas e florestas fechadas
  vila: null
  arte: { formato: quadro, plano: de cima }
  cena:
    - "Os fios brilham entre as árvores quando a lanterna passa, grossos como corda. Lá no alto, alguma coisa recolhe as pernas devagar, uma por uma. O primeiro fio que encosta no braço do ninja já não sai mais."
  descricao:
    - "Nas cavernas úmidas e nas florestas onde o sol não entra, as aranhas crescem sem limite. Tecem armadilhas entre os galhos, envolvem a presa em seda dura como aço e guardam a comida para depois. Algumas famílias de ninjas aprenderam a imitá-las; outras viraram comida delas."
  estagios:
    - nome: Aranha da caverna
      ameaca: 2
      papel: assassino
      resumo: "Do tamanho de um cão, espera no teto."
      ataques:
        - { nome: Presas, alcance: Corpo a corpo, efeito: "Dano em dobro contra alvo **Desprevenido**. O alvo resiste com VIG contra a DT 13 ou sofre o Veneno Comum (cap. 11)." }
      tracos:
        - { nome: Escaladora, efeito: "Anda em paredes e tetos como se fosse chão." }
    - nome: Aranha gigante
      ameaca: 6
      papel: controlador
      resumo: "Cobre uma clareira inteira de teia antes de descer."
      ataques:
        - { nome: Presas, alcance: Corpo a corpo, efeito: "O alvo resiste com VIG contra a DT 16 ou fica **Envenenado** (1d4 de dano por turno, por 3 turnos)." }
        - { nome: Jato de teia, alcance: Médio, dano: 1d4, efeito: "O alvo resiste com FOR contra a DT 16 ou fica **Imobilizado** pela teia." }
      tracos:
        - { nome: Teia, efeito: "Prepara a área antes da luta: quem entra nela sem perceber fica **Imobilizado** (Resistência de FOR contra a DT 16 para sair)." }
    - nome: Rainha das aranhas
      ameaca: 11
      papel: chefe
      resumo: "Velha como a caverna, com um casulo para cada intruso que já entrou."
      ataques:
        - { nome: Presas da rainha, alcance: Corpo a corpo, efeito: "O alvo resiste com VIG contra a DT 18 ou fica **Paralisado** até o fim do próximo turno." }
        - { nome: Rede de seda, alcance: Médio, dano: 1d6, efeito: "Atinge todos numa área de 3 m: cada um resiste com FOR contra a DT 18 ou fica **Imobilizado**." }
      tracos:
        - { nome: Seda de aço, efeito: "Cortar a teia dela exige uma arma afiada e um teste de FOR contra a DT 18." }
        - { nome: Filhotes, efeito: "Uma vez por cena, solta os filhotes: aparecem quatro aranhas da caverna, que agem na iniciativa dela." }
  taticas:
    - "Não perseguem. Esperam a presa cair na teia, envenenam quem se debate e embrulham quem para de se mexer."
  ganchos:
    - "Os casulos da caverna têm bandanas de ninjas desaparecidos, e um deles ainda respira."
    - "Um ninja renegado treina aranhas para guardar o esconderijo dele."
  tags: [Cauteloso, Tático]

- slug: urso-gigante
  nome: Urso gigante
  tipo: fauna
  ameaca: 6
  papel: lutador
  rd: 2
  origem: Florestas de montanha
  vila: null
  arte: { formato: quadro, plano: de baixo }
  cena:
    - "As folhas vermelhas ainda estão caindo quando ele se levanta nas patas de trás. Fica mais alto que as árvores novas. O rugido sacode os galhos e espanta todos os pássaros de uma vez."
  descricao:
    - "As florestas do mundo shinobi criam animais grandes demais, e o urso gigante é o rei de muitas delas. Não caça ninjas, mas defende o território com uma fúria que derruba árvores. Os caçadores dizem que um urso ferido é o bicho mais perigoso da montanha."
  ataques:
    - { nome: Garras, alcance: Corpo a corpo, efeito: "Pode prender o alvo num abraço: ele fica **Imobilizado** até se libertar com uma Resistência de FOR contra a DT 15." }
  tracos:
    - { nome: Couro grosso, efeito: "RD 2." }
    - { nome: Fúria, efeito: "Abaixo da metade dos PV, os ataques têm vantagem, e ele não foge mais." }
  taticas:
    - "Avisa antes: ruge, bate no chão e só ataca quem não recua. Depois que ataca, só para quando o intruso fugir ou cair."
  ganchos:
    - "Tem uma kunai envenenada cravada no ombro. Alguém anda treinando nessa floresta."
    - "Guarda uma caverna onde um ninja ferido se escondeu dias atrás."
  tags: [Brutal, Agressivo]

- slug: tigre-da-montanha
  nome: Tigre da montanha
  tipo: fauna
  ameaca: 5
  papel: assassino
  origem: Florestas de bambu e montanhas
  vila: null
  arte: { formato: faixa, plano: plano médio }
  cena:
    - "O bambuzal está quieto demais. Nenhum inseto, nenhum pássaro. Então as listras se mexem entre as hastes, e o grupo percebe que está sendo olhado há muito tempo."
  descricao:
    - "O tigre da montanha caça sozinho e não perde. Persegue a presa por horas, invisível entre o bambu e as sombras, e ataca uma vez só, pelas costas. Algumas vilas usam a pele dele como prova de coragem dos genin. Poucas peles chegam inteiras."
  ataques:
    - { nome: Bote, alcance: Corpo a corpo, efeito: "Dano em dobro contra alvo **Desprevenido**. O alvo resiste com FOR contra a DT 15 ou fica **Caído**." }
  tracos:
    - { nome: Listras, efeito: "Tem vantagem em Furtividade entre plantas e sombras." }
    - { nome: Salto, efeito: "Salta até o alvo e ataca na mesma ação." }
  taticas:
    - "Segue o grupo de longe, espera alguém ficar para trás e ataca de surpresa. Se a primeira investida falha, some de novo e tenta outra vez mais tarde."
  ganchos:
    - "Uma vila oferece uma recompensa pelo tigre que já matou três lenhadores."
    - "O tigre protege um filhote ferido por uma armadilha de caçadores ilegais."
  tags: [Cauteloso, Agressivo]

- slug: javali-gigante
  nome: Javali gigante
  tipo: fauna
  ameaca: 4
  papel: lutador
  origem: Florestas do País do Fogo
  vila: null
  arte: { formato: quadro, plano: corpo inteiro }
  cena:
    - "Primeiro treme o chão, depois as árvores pequenas caem para os lados. O javali sai do mato bufando, as presas amarelas do tamanho de um braço, e não diminui a velocidade nem um pouco."
  descricao:
    - "O javali gigante é burro, teimoso e quase impossível de parar quando decide correr. Destrói plantações, derruba cercas e atropela quem estiver no caminho. Os genin costumam caçá-lo em missões de rank D, e alguns voltam mancando."
  ataques:
    - { nome: Investida das presas, alcance: Corpo a corpo, efeito: "Se correu em linha reta até o alvo, o alvo resiste com FOR contra a DT 14 ou é jogado longe e fica **Caído**." }
  tracos:
    - { nome: Teimoso, efeito: "Não pode ser empurrado e tem vantagem para resistir a **Amedrontado**." }
  taticas:
    - "Corre direto no que o assustou, passa por cima, vira e corre de novo. Não tem outra tática, e quase nunca precisa de outra."
  ganchos:
    - "O javali destruiu a plantação de uma vila que paga a missão com o que sobrou da colheita."
    - "Alguém está espantando javalis para dentro das vilas de propósito."
  tags: [Agressivo, Brutal]
