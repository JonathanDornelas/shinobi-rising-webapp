- slug: cla-hyuuga
  nome: Hyuuga, guardião do Byakugan
  tipo: shinobi
  origem: Clã Hyuuga
  vila: konoha
  arte:
    formato: retrato
    plano: close
  cena:
    - "As veias saltam em volta dos olhos brancos, e ele enxerga tudo ao mesmo tempo: o grupo, a árvore atrás do grupo, o chakra correndo dentro de cada um. Ele abaixa o corpo na postura do Punho Gentil. Os dois dedos vão direto num ponto que ninguém sabia que tinha."
  descricao:
    - Os Hyuuga são o clã mais antigo e orgulhoso de Konoha, divididos entre a família principal e a secundária, marcada por um selo na testa. O Byakugan, os olhos brancos do clã, vê através das paredes e enxerga os pontos de chakra do corpo, e o Punho Gentil fecha esses pontos com a ponta dos dedos.
  estagios:
    - nome: Genin
      ameaca: 3
      papel: lutador
      perfil: equilibrado
      estilo: vigilante
      resumo: Saído da Academia há pouco, ainda aprende as técnicas do clã.
      ataques: &a16
        - nome: Punho Gentil
          alcance: Corpo a corpo
          efeito: "O alvo também perde 1d6 PC: o golpe fecha os pontos de chakra."
      jutsus:
        - { slug: juuken-tenketsushin }
        - { slug: shotei }
      tracos:
        - &a17
          nome: Byakugan
          efeito: "Enxerga quase em todas as direções, através de paredes e do encobrimento, e vê o fluxo de chakra: não pode ser surpreendido e não sofre penalidade por visibilidade. Tem um ponto cego pequeno, atrás da nuca."
