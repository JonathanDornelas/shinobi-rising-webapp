- slug: cla-aburame
  nome: Aburame, mestre dos insetos
  tipo: shinobi
  origem: Clã Aburame
  vila: konoha
  arte:
    formato: quadro
    plano: de baixo
  cena:
    - Ele não diz nada. Ajeita os óculos escuros, a gola alta esconde metade do rosto, e um zumbido baixo começa a sair das mangas do casaco. Quando o grupo percebe, o céu da clareira já está escuro de insetos.
  descricao:
    - Os Aburame nascem com uma colônia de insetos vivendo dentro do corpo, os kikaichū, que comem chakra. Falam pouco, pensam muito e se escondem atrás de casacos de gola alta e óculos escuros. Uma luta contra um Aburame se perde aos poucos, sem perceber, até o chakra acabar.
  estagios:
    - nome: Genin
      ameaca: 2
      papel: controlador
      perfil: chakra-farto
      resumo: Saído da Academia há pouco, ainda aprende as técnicas do clã.
