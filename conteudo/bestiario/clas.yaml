  descricao:
    - Os Inuzuka lutam em dupla com os cães ninja do clã, desde criança. Têm faro, garras e um jeito selvagem de lutar, e as marcas vermelhas em forma de presa no rosto dizem a qualquer um de onde vieram. O cão é parte da família, e ferir um deles é declarar guerra ao clã inteiro.
  estagios:
