          nome: Companheiro ninken
          efeito: Luta junto com um cão do clã, que usa a ficha do Cão de caça (verbete Cães ninja) e age na mesma iniciativa.
        - &a12
          nome: Faro
          efeito: Tem vantagem em Rastreamento e acha qualquer um pelo cheiro, mesmo sob Henge.
