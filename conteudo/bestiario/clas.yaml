# Bestiário · ninjas de clã: um adversário para cada clã do livro (cap. 8.3), com os jutsus do próprio clã.
# Quatro níveis por clã, na mesma página: Genin (ameaça 2), Chunin (5), Jounin (8) e Líder do clã (11, chefe); os clãs
# com Kekkei Genkai sobem um ponto, como manda o molde de clã do Como usar. Cada nível usa os jutsus do clã que o rank
# dele libera. Formato de cada verbete: veja o cabeçalho de shinobi.yaml.
- slug: cla-nara
  nome: Nara, estrategista das sombras
  tipo: shinobi
  origem: Clã Nara
  vila: konoha
  arte:
    formato: faixa
    plano: de cima
  cena:
    - O sol se põe atrás dele, e a sombra do ninja se estica pelo campo, comprida demais, fina demais. Ela vem pelo chão sem pressa nenhuma, contorna uma pedra e encosta na sombra do primeiro inimigo. Daí em diante, ninguém do outro lado mexe um dedo sem a permissão dele.
  descricao:
    - "Os Nara são os estrategistas de Konoha: preguiçosos para tudo, menos para pensar. Lutam com a própria sombra, que prende, estrangula e costura os inimigos no chão, e planejam a luta dez jogadas antes de ela começar. Um Nara nunca está onde a luta parece estar."
  estagios:
    - nome: Genin
      ameaca: 2
      papel: controlador
      perfil: chakra-farto
      resumo: Saído da Academia há pouco, ainda aprende as técnicas do clã.
      ataques: &a1
        - nome: Kunai
          alcance: Corpo a corpo
      jutsus:
        - slug: kage-yose-no-jutsu
        - slug: kage-mane-no-jutsu
      tracos:
        - &a2
          nome: Dez jogadas à frente
          efeito: "Antes da luta, prepara o terreno com o grupo à vista: tem vantagem na Iniciativa e escolhe onde a luta começa."
        - &a3
          nome: Sem sombra
          sem técnica: null
          efeito: "As técnicas de sombra precisam de sombra: no escuro total ou sob o sol do meio-dia, o alcance delas cai pela metade."
    - nome: Chunin
      ameaca: 5
      papel: controlador
      perfil: chakra-farto
      resumo: Já domina as técnicas básicas do clã e lidera uma equipe de genin.
      ataques: *a1
      jutsus:
        - { slug: kagemane-kage-shibari-no-jutsu }
        - { slug: kage-mane-no-jutsu }
        - { slug: kage-yose-no-jutsu }
      tracos:
        - *a2
        - *a3
    - nome: Jounin
      ameaca: 8
      papel: controlador
      perfil: chakra-farto
      resumo: Um dos melhores do clã, com as técnicas avançadas na ponta dos dedos.
      ataques: *a1
      jutsus:
        - slug: kage-kubishibari-no-jutsu
        - slug: kage-nui-no-jutsu
        - slug: kagemane-shuriken-no-jutsu
        - slug: kage-mane-no-jutsu
      tracos:
        - *a2
        - *a3
    - nome: Nível Anbu
      arte:
        formato: quadro
        plano: silhueta
      ameaca: 11
      papel: controlador
      perfil: equilibrado
      estilo: calculista
      resumo: Prende a sombra do alvo de longe e segura até a equipe chegar.
      ataques: *a1
      jutsus:
        - { slug: kage-kubishibari-no-jutsu }
        - { slug: kage-nui-no-jutsu }
        - { slug: kagemane-shuriken-no-jutsu }
        - { slug: kokuangyou-no-jutsu }
      tracos:
        - *a2
        - *a3
        - &mascara-anbu { nome: Máscara, efeito: "Testes de Persuasão para arrancar qualquer informação têm desvantagem." }
    - nome: Líder do clã
      ameaca: 11
      papel: chefe
      perfil: chakra-farto
      estilo: calculista
      resumo: A cabeça do clã, que guarda os segredos dele e decide por todos.
      ataques: *a1
      jutsus:
        - slug: kagetsukami-no-jutsu
        - slug: kage-kubishibari-no-jutsu
        - slug: kage-nui-no-jutsu
        - slug: kagemane-shuriken-no-jutsu
      tracos:
        - *a2
        - *a3
        - nome: Escolta do clã
          efeito: Costuma vir com dois ninjas do clã de nível Chunin (este verbete), que agem na iniciativa dele.
  taticas:
    - Fica longe, atrás de cobertura, e prende quem for mais perigoso com a Imitação da Sombra. Os aliados dele cuidam do resto enquanto o alvo não pode se mexer.
  ganchos:
    - Um Nara de outra geração está do lado inimigo, e o plano dele já previu a chegada do grupo.
    - Os cervos sagrados do clã sumiram da floresta, e os Nara não querem ajuda de fora.
  tags:
    - Tático
    - Cauteloso
- slug: cla-akimichi
  nome: Akimichi, guerreiro gigante
  tipo: shinobi
  origem: Clã Akimichi
  vila: konoha
  arte:
    formato: pagina
    plano: de baixo
  cena:
    - Ele junta as mãos num selo e respira fundo, e o corpo começa a crescer. As mangas rasgam, a sombra dele engole a casa ao lado, e o punho que desce do céu é maior que a carroça onde o grupo se escondia.
  descricao:
    - Os Akimichi transformam calorias em chakra e chakra em tamanho. Usam armadura vermelha com o kanji de comida, comem o tempo todo e crescem partes do corpo, ou o corpo inteiro, até virar gigantes. São leais até o fim aos amigos, e quem ofende um Akimichi chamando-o de gordo descobre o quanto um punho pode crescer.
  estagios:
    - nome: Genin
      ameaca: 2
      papel: lutador
      perfil: corpo-robusto
      resumo: Saído da Academia há pouco, ainda aprende as técnicas do clã.
      ataques: &a4
        - nome: Punho expandido
          alcance: Curto
      jutsus:
        - { slug: baika-no-jutsu }
        - { slug: karori-kontororu }
      tracos:
        - &a5
          nome: Tanque de carne
          efeito: "Rolando no Nikudan Sensha, passa por cima de quem estiver no caminho: Resistência de Acrobacia contra a DT 15 ou fica **Caído**."
        - &a6
          nome: Pílulas do clã
          efeito: "Carrega as pílulas de três cores do clã (Clã Akimichi, cap. 8): uma delas na luta, e o preço vem depois."
    - nome: Chunin
      ameaca: 5
      papel: lutador
      perfil: corpo-robusto
      resumo: Já domina as técnicas básicas do clã e lidera uma equipe de genin.
      ataques: *a4
      jutsus:
        - { slug: nikudan-sensha }
        - { slug: bubun-baika-no-jutsu }
        - { slug: baika-no-jutsu }
        - { slug: karori-kontororu }
      tracos:
        - *a5
        - *a6
    - nome: Jounin
      ameaca: 8
      papel: lutador
      perfil: corpo-robusto
      resumo: Um dos melhores do clã, com as técnicas avançadas na ponta dos dedos.
      ataques: *a4
      jutsus:
        - { slug: chou-baika-no-jutsu }
        - { slug: choharite }
        - { slug: hari-jizou-akimichi-hen }
        - { slug: nikudan-sensha }
      tracos:
        - *a5
        - *a6
    - nome: Nível Anbu
      arte:
        formato: retrato
        plano: escorço
      ameaca: 11
      papel: lutador
      perfil: corpo-resistente
      estilo: defensivo
      resumo: Na Anbu aprendeu a crescer só o punho, e só no último instante.
      ataques: *a4
      jutsus:
        - { slug: bubun-baika-no-jutsu }
        - { slug: choharite }
        - { slug: choudan-bakugeki }
        - { slug: nikudan-sensha }
      tracos:
        - *a5
        - *a6
        - *mascara-anbu
    - nome: Líder do clã
      ameaca: 11
      papel: chefe
      perfil: corpo-resistente
      resumo: A cabeça do clã, que guarda os segredos dele e decide por todos.
      ataques: *a4
      jutsus:
        - { slug: cho-modo }
        - { slug: choudan-bakugeki }
        - { slug: daburu-nikudan-sensha }
        - { slug: chou-baika-no-jutsu }
      tracos:
        - *a5
        - *a6
        - nome: Escolta do clã
          efeito: Costuma vir com dois ninjas do clã de nível Chunin (este verbete), que agem na iniciativa dele.
  taticas:
    - Vai na frente, cresce e protege os companheiros com o próprio corpo. Não recua enquanto houver um amigo de pé atrás dele.
  ganchos:
    - Um Akimichi exilado guarda a receita das pílulas proibidas do clã.
    - O grupo arruinou o banquete de um festival do clã, e isso é mais grave do que parece.
  tags:
    - Leal
    - Brutal
- slug: cla-yamanaka
  nome: Yamanaka, invasor de mentes
  tipo: shinobi
  origem: Clã Yamanaka
  vila: konoha
  arte:
    formato: retrato
    plano: close
  cena:
    - Ela forma o selo com as duas mãos na frente do rosto, um losango apontado para o alvo. Os olhos perdem o brilho. Do outro lado da clareira, o ninja inimigo para, sorri do mesmo jeito que ela sorria e vira a kunai para os próprios companheiros.
  descricao:
    - "Os Yamanaka lutam por dentro: mandam a própria mente para o corpo do inimigo, leem pensamentos, ligam aliados numa conversa sem palavras e sentem presenças a quilômetros. São os interrogadores e os sensores de Konoha, e quase sempre têm cabelo claro e uma floricultura na família."
  estagios:
    - nome: Genin
      ameaca: 2
      papel: controlador
      perfil: chakra-farto
      resumo: Saído da Academia há pouco, ainda aprende as técnicas do clã.
