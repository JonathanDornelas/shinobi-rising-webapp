        - &a8
          nome: Corpo vazio
          efeito: "Enquanto a mente dela está no corpo de outro, o corpo dela fica caído e indefeso: um aliado costuma ficar de guarda."
        - &a9
          nome: Sensora
          efeito: "Sente a presença de chakra em volta: ninguém se aproxima dela sem ser percebido."
    - nome: Chunin
      ameaca: 5
      papel: controlador
