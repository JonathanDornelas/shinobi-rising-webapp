      tracos:
        - &a14
          nome: Insetos espiões
          efeito: "Antes da luta, um inseto fêmea gruda num inimigo: o Aburame sabe onde ele está pelo resto do dia."
        - &a15
          nome: Clone de insetos
          efeito: O primeiro golpe que o acertaria em cada cena desfaz um clone de insetos no lugar dele.
