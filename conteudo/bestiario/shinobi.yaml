# Bestiário · shinobi: arquétipos que cabem em qualquer história. Os ninjas de cada vila estão em vilas.yaml, os de
# clã em clas.yaml, os Sennin em sennin.yaml e as organizações em organizacoes.yaml.
#
# Formato de um verbete (vale para todos os arquivos desta pasta):
#   slug, nome, tipo (shinobi, fora da lei, guerreiro, organização, fauna, invocação, criatura), origem, vila (konoha...)
#   arte: { formato: faixa | retrato | quadro | pagina, plano }   (o arquivo é static/bestiario/<slug>.png)
#   cena, descricao, taticas, ganchos: Markdown de uma linha cada; tags: as da ficha resumida (cap. 23.2)
#   a ficha de combate: ameaca + papel (os números saem da tabela de ameaça do Como usar, ajustada pelo papel),
#     ou ficha: pequena | media | grande | chefe (invocações: os números do cap. 14);
#     ataques (o primeiro usa o acerto e o dano da tabela; os outros podem trazer dano próprio), jutsus (slug do
#     catálogo ou nome + nota), tracos; exceções raras: pv, pc, defesa, iniciativa, dt, rd, membros, nota.
#   estagios: quando o adversário tem níveis (Genin, Chunin, Jounin, nível Anbu e nível Kage: ameaça 2, 5, 8, 11 e 16)
#     ou cresce e se transforma (invocações, marcas, mantos). Cada estágio tem nome, resumo e a sua própria ficha de
#     combate, no lugar da ficha direto no verbete.

- slug: ninja-medico
  nome: Ninja médico de campo
  tipo: shinobi
  origem: Qualquer vila
  vila: null
  arte: { formato: quadro, plano: plano médio }
  cena:
    - "No meio da fumaça, ela está de joelhos, com as duas mãos acesas de verde sobre o peito de um ferido. Não levanta os olhos quando a kunai passa raspando. Só depois que a respiração do ferido volta é que ela vira o rosto para o grupo."
  descricao:
    - "Uma equipe com médico é outra equipe. Ele fecha cortes no meio da luta, tira aliados da beira da morte e ainda sabe exatamente onde cortar quando precisa. Por isso, todo ninja experiente aprende a mesma regra: na luta contra uma equipe inimiga, derrube o médico primeiro."
  estagios:
    - nome: Genin
      arte: { formato: retrato, plano: por cima do ombro }
      ameaca: 2
      papel: suporte
      resumo: "Aprendiz de medicina que ainda treme quando o corte é fundo."
      ataques:
        - { nome: Kunai, alcance: Corpo a corpo }
      jutsus:
        - { slug: shosen-jutsu }
      tracos:
        - &triagem { nome: Triagem, efeito: "Uma vez por rodada, pode estabilizar um aliado caído ao alcance com uma ação secundária, sem teste." }
    - nome: Chunin
      arte: { formato: quadro, plano: plano aberto }
      ameaca: 5
      papel: suporte
      resumo: "Fecha cortes no meio da luta e sabe onde cortar quando precisa."
      ataques:
        - { nome: Kunai, alcance: Corpo a corpo }
      jutsus:
        - { slug: shosen-jutsu }
        - { slug: chakra-no-mesu }
      tracos:
        - *triagem
    - nome: Jounin
      arte: { formato: retrato, plano: close }
      ameaca: 8
      papel: suporte
      resumo: "Cirurgião de campo que trata veneno, osso e chakra ao mesmo tempo."
      ataques:
        - { nome: Kunai, alcance: Corpo a corpo }
      jutsus:
        - { slug: shosen-jutsu-2 }
        - { slug: shosen-jutsu }
        - { slug: chakra-no-mesu }
        - { slug: kage-bunshin-no-jutsu }
      tracos:
        - *triagem
        - &antidotos { nome: Antídotos, efeito: "Como ação secundária, tira um aliado ao alcance da condição **Envenenado**." }
    - nome: Nível Anbu
      arte: { formato: faixa, plano: câmera inclinada }
      ameaca: 11
      papel: suporte
      resumo: "Médico de elite que acompanha as equipes mais perigosas e traz todo mundo de volta."
      ataques:
        - { nome: Bisturi de chakra, alcance: Corpo a corpo }
      jutsus:
        - { slug: shosen-jutsu-2 }
        - { slug: chakra-no-mesu }
        - { slug: shunshin-no-jutsu }
        - { slug: kage-bunshin-no-jutsu }
      tracos:
        - *triagem
        - *antidotos
        - &cirurgia { nome: Cirurgia de campo, efeito: "Uma vez por cena, como ação primária, levanta um aliado caído ao alcance com metade dos PV." }
    - nome: Nível Kage
      arte: { formato: pagina, plano: de baixo }
      ameaca: 16
      papel: chefe
      resumo: "A lenda viva da medicina ninja, que cura qualquer ferida e quebra qualquer osso."
      ataques:
        - { nome: Soco de chakra, alcance: Corpo a corpo }
      jutsus:
        - { slug: shosen-jutsu-2 }
        - { slug: chakra-no-mesu }
        - { slug: kage-bunshin-no-jutsu }
        - { nome: Força monstruosa, nota: "Concentra o chakra no punho no instante do golpe e racha o chão numa área de 6 m: quem está nela resiste com Acrobacia contra a DT da ficha ou fica **Caído**." }
      tracos:
        - *cirurgia
        - *antidotos
        - { nome: Selo de regeneração, efeito: "Uma vez por cena, quando cairia a 0 PV, o selo guardado há anos se solta e ela volta com metade dos PV." }
  taticas:
    - "Fica atrás da linha, cura quem está pior e só luta quando é alcançado. Aí usa o bisturi de chakra, que não deixa marca na pele."
    - "Se os aliados caem todos, rende-se. Médico vale mais vivo para qualquer vila."
  ganchos:
    - "Tratou feridos dos dois lados da última batalha e tem amigos em ambos."
    - "Carrega o único antídoto para o veneno que derrubou alguém do grupo."
  tags: [Cauteloso, Diplomata]

- slug: ilusionista
  nome: Ilusionista
  tipo: shinobi
  origem: Qualquer vila
  vila: null
  arte: { formato: quadro, plano: close }
  cena:
    - "As pétalas começam a cair do teto da casa de chá, e ninguém estranha. Só quando a primeira pétala atravessa a mão de alguém é que o grupo percebe: a mulher sentada no canto não piscou nenhuma vez desde que eles entraram."
  descricao:
    - "O ilusionista luta dentro da cabeça dos outros. Prefere que a vítima nunca descubra que houve luta: uma porta que leva ao lugar errado, um aliado que vira inimigo por um instante, o chão que some debaixo dos pés. Corpo a corpo, ele é frágil. O problema é chegar até ele."
  estagios:
    - nome: Genin
      arte: { formato: retrato, plano: plano médio }
      ameaca: 2
      papel: controlador
      resumo: "Descobriu cedo que a mente dos outros é mais fácil de enganar que o corpo."
      ataques:
        - { nome: Kunai, alcance: Corpo a corpo }
      jutsus:
        - { slug: kai }
        - { slug: kirigakure-no-jutsu-ilusorio }
      tracos:
        - &mente-treinada { nome: Mente treinada, efeito: "Tem vantagem para perceber um genjutsu e para se libertar dele." }
    - nome: Chunin
      arte: { formato: quadro, plano: câmera inclinada }
      ameaca: 5
      papel: controlador
      resumo: "Faz o chão sumir debaixo dos pés de quem chega perto demais."
      ataques:
        - { nome: Kunai, alcance: Corpo a corpo }
      jutsus:
        - { slug: magen-narakumi-no-jutsu }
        - { slug: kirigakure-no-jutsu-ilusorio }
        - { slug: kai }
      tracos:
        - *mente-treinada
    - nome: Jounin
      arte: { formato: retrato, plano: olhos }
      ameaca: 8
      papel: controlador
      resumo: "Prende o mais forte do grupo numa ilusão logo no começo e cuida dos outros depois."
      ataques:
        - { nome: Kunai, alcance: Corpo a corpo }
      jutsus:
        - { slug: kirigakure-no-jutsu-ilusorio }
        - { slug: magen-narakumi-no-jutsu }
        - { slug: magen-kyouten-chiten }
        - { slug: kokuangyou-no-jutsu }
      tracos:
        - *mente-treinada
        - &isca { nome: Isca, efeito: "Uma vez por cena, quando um ataque o acertaria, revela que era uma ilusão: o ataque erra, e ele aparece a alguns metros dali." }
    - nome: Nível Anbu
      arte: { formato: faixa, plano: perfil }
      ameaca: 11
      papel: controlador
      resumo: "Prende um esquadrão inteiro num mesmo pesadelo."
      ataques:
        - { nome: Kunai, alcance: Corpo a corpo }
      jutsus:
        - { slug: kokuangyou-no-jutsu }
        - { slug: magen-jubaku-satsu }
        - { slug: magen-kyouten-chiten }
        - { slug: magen-narakumi-no-jutsu }
      tracos:
        - *isca
        - { nome: Ilusão em massa, efeito: "Uma vez por cena, cada inimigo numa área de 6 m resiste com ESP contra a DT 19 ou fica **Em Genjutsu** até se libertar." }
    - nome: Nível Kage
      arte: { formato: pagina, plano: plano aberto }
      ameaca: 16
      papel: chefe
      resumo: "Um segundo no mundo real, três dias dentro da ilusão dele."
      ataques:
        - { nome: Lâmina ilusória, alcance: Curto }
      jutsus:
        - { slug: kokuangyou-no-jutsu }
        - { slug: magen-jubaku-satsu }
        - { slug: magen-kyouten-chiten }
        - { slug: kirigakure-no-jutsu-ilusorio }
      tracos:
        - *isca
        - { nome: Mundo de ilusão, efeito: "Uma vez por cena, como ação primária, olha nos olhos de um alvo: ele resiste com ESP contra a DT 21 ou fica **Em Genjutsu** e, quando se libertar, ganha dois níveis de Fadiga." }
        - { nome: Ilusão em massa, efeito: "Uma vez por cena, cada inimigo numa área de 12 m resiste com ESP contra a DT 21 ou fica **Em Genjutsu** até se libertar." }
  taticas:
    - "Fica longe, invisível na multidão ou atrás de aliados, e prende o personagem mais forte numa ilusão logo no começo. Depois cuida dos outros, um por um."
  ganchos:
    - "Faz o grupo reviver o pior dia de cada um, e parece saber demais sobre esses dias."
    - "Uma vila inteira acredita num festival que nunca acabou. Alguém mantém a ilusão há semanas."
  tags: [Cauteloso, Tático]

- slug: mestre-do-selo
  nome: Mestre do selo
  tipo: shinobi
  origem: Qualquer vila
  vila: null
  arte: { formato: faixa, plano: de cima }
  cena:
    - "O chão da sala inteira está coberto de tinta, em círculos dentro de círculos. O velho no centro não se levanta. Só toca o pincel no último traço, e todos os símbolos acendem ao mesmo tempo."
  descricao:
    - "Selamento é paciência transformada em arma. O mestre do selo prepara o terreno antes da luta: armadilhas desenhadas no chão, pergaminhos que guardam armas e jutsus, selos que prendem o chakra de quem pisa onde não deve. Quem entra no território dele já está lutando em desvantagem."
  estagios:
    - nome: Genin
      arte: { formato: retrato, plano: de cima }
      ameaca: 2
      papel: controlador
      resumo: "Aprendiz de selamento que ainda borra a tinta, mas já sabe esconder uma armadilha."
      ataques:
        - { nome: Pergaminho de armas, alcance: Médio }
      jutsus:
        - { slug: kai }
      tracos:
        - { nome: Selo de papel, efeito: "Antes da luta, esconde um selo no chão: o primeiro inimigo que pisar nele resiste com Selamento contra a DT 14 ou fica **Imobilizado** até o fim do próximo turno." }
    - nome: Chunin
      arte: { formato: quadro, plano: câmera no chão }
      ameaca: 5
      papel: controlador
      resumo: "Prepara uma sala inteira antes de deixar o inimigo entrar."
      ataques:
        - { nome: Pergaminho de armas, alcance: Médio }
      jutsus:
        - { slug: kai }
        - { slug: doryuuheki }
      tracos:
        - { nome: Território preparado, efeito: "No lugar que ele preparou, um inimigo que entra numa área marcada resiste com Selamento contra a DT 16 ou fica **Imobilizado** pelo selo." }
    - nome: Jounin
      arte: { formato: retrato, plano: emoldurado }
      ameaca: 8
      papel: controlador
      resumo: "Prende o corpo e depois o chakra de quem cai nas armadilhas dele."
      ataques:
        - { nome: Pergaminho de armas, alcance: Médio }
      jutsus:
        - { slug: kai }
        - { slug: doryuuheki }
      tracos:
        - { nome: Território preparado, efeito: "No lugar que ele preparou, um inimigo que entra numa área marcada resiste com Selamento contra a DT 17 ou fica **Imobilizado** pelo selo." }
        - { nome: Selo de chakra, efeito: "Como ação primária, toca um inimigo **Imobilizado**: ele não pode usar jutsus até se libertar (Resistência de CTR contra a DT 17 no fim de cada turno)." }
    - nome: Nível Anbu
      arte: { formato: faixa, plano: plano aberto }
      ameaca: 11
      papel: controlador
      resumo: "Espalha selos pelo campo e aparece em qualquer um deles."
      ataques:
        - { nome: Pergaminho de armas, alcance: Médio }
      jutsus:
        - { slug: kai }
        - { slug: doryuuheki }
        - { slug: kage-bunshin-no-jutsu }
      tracos:
        - { nome: Território preparado, efeito: "No lugar que ele preparou, um inimigo que entra numa área marcada resiste com Selamento contra a DT 19 ou fica **Imobilizado** pelo selo." }
        - { nome: Selo de chakra, efeito: "Como ação primária, toca um inimigo **Imobilizado**: ele não pode usar jutsus até se libertar (Resistência de CTR contra a DT 19 no fim de cada turno)." }
        - { nome: Selo de transporte, efeito: "Uma vez por cena, troca de lugar com um selo que deixou no campo, sem gastar ação." }
    - nome: Nível Kage
      arte: { formato: pagina, plano: de costas }
      ameaca: 16
      papel: chefe
      resumo: "Guarda uma prisão de selos que poderia trancar até uma Besta com Cauda."
      ataques:
        - { nome: Pergaminho de armas, alcance: Médio }
      jutsus:
        - { slug: kai }
        - { slug: doryuuheki }
        - { slug: kage-bunshin-no-jutsu }
      tracos:
        - { nome: Território preparado, efeito: "No lugar que ele preparou, um inimigo que entra numa área marcada resiste com Selamento contra a DT 21 ou fica **Imobilizado** pelo selo." }
        - { nome: Selo de chakra, efeito: "Como ação primária, toca um inimigo **Imobilizado**: ele não pode usar jutsus até se libertar (Resistência de CTR contra a DT 21 no fim de cada turno)." }
        - { nome: Selo de prisão, efeito: "Uma vez por cena, tenta selar num pergaminho um inimigo **Imobilizado**: ele resiste com CTR contra a DT 21 no fim de cada turno e, depois de três falhas, fica selado até alguém quebrar o selo (teste de Selamento contra a DT 21)." }
  taticas:
    - "Nunca luta no lugar que o inimigo escolheu. Atrai o grupo para a sala preparada, fica atrás das armadilhas e sela quem cair nelas."
  ganchos:
    - "Guarda uma prisão de selos onde alguma coisa muito antiga está presa, e o selo está enfraquecendo."
    - "Quer ensinar um personagem que tem o dom do Selamento, por um preço."
  tags: [Cauteloso, Tático]

- slug: mestre-de-armas
  nome: Mestre de armas
  tipo: shinobi
  origem: Qualquer vila
  vila: null
  arte: { formato: retrato, plano: de baixo }
  cena:
    - "Ela abre os dois pergaminhos ao mesmo tempo, e o ar se enche de aço. Kunai, foices, correntes e lanças saem da fumaça girando, e cada uma parece saber exatamente para onde ir."
  descricao:
    - "Para o mestre de armas, um pergaminho de selamento é um arsenal de bolso. Ele carrega dezenas de armas guardadas em tinta e as solta todas de uma vez, ou uma de cada vez, escolhendo a certa para cada alvo. Não precisa de chakra para matar: precisa de espaço."
  estagios:
    - nome: Genin
      arte: { formato: retrato, plano: câmera no chão }
      ameaca: 2
      papel: atirador
      resumo: "Ainda carrega as armas na bolsa, não em pergaminhos, e já acerta o alvo de olhos fechados."
      ataques:
        - { nome: Arma arremessada, alcance: Médio }
      jutsus:
        - { slug: kawarimi-no-jutsu }
      tracos:
        - &recolher { nome: Recolher, efeito: "Puxa de volta as armas com fios de chakra: nunca fica sem munição." }
    - nome: Chunin
      arte: { formato: quadro, plano: perfil }
      ameaca: 5
      papel: atirador
      resumo: "Solta o pergaminho inteiro quando o grupo se junta num lugar só."
      ataques:
        - { nome: Arma arremessada, alcance: Médio }
        - { nome: Corrente com foice, alcance: Curto, efeito: "O alvo resiste com FOR contra a DT 15 ou fica **Imobilizado** pela corrente." }
      tracos:
        - { nome: Chuva de aço, efeito: "Uma vez por cena, solta o pergaminho inteiro: cada um numa área de 6 m faz uma Resistência de Acrobacia contra a DT 15 e sofre 2d8 de dano, ou metade se passar." }
        - *recolher
    - nome: Jounin
      arte: { formato: retrato, plano: por cima do ombro }
      ameaca: 8
      papel: atirador
      resumo: "Cobre o campo de aço do alto e prende com a corrente quem tenta chegar perto."
      ataques:
        - { nome: Arma arremessada, alcance: Médio }
        - { nome: Corrente com foice, alcance: Curto, efeito: "O alvo resiste com FOR contra a DT 16 ou fica **Imobilizado** pela corrente." }
      jutsus:
        - { slug: kawarimi-no-jutsu }
        - { slug: shunshin-no-jutsu }
      tracos:
        - { nome: Chuva de aço, efeito: "Uma vez por cena, solta o pergaminho inteiro: cada um numa área de 6 m faz uma Resistência de Acrobacia contra a DT 16 e sofre 3d8 de dano, ou metade se passar." }
        - *recolher
    - nome: Nível Anbu
      arte: { formato: faixa, plano: câmera inclinada }
      ameaca: 11
      papel: atirador
      resumo: "Troca de arma a cada golpe e nunca repete a mesma duas vezes."
      ataques:
        - { nome: Arma do arsenal, alcance: Médio }
        - { nome: Corrente com foice, alcance: Curto, efeito: "O alvo resiste com FOR contra a DT 18 ou fica **Imobilizado** pela corrente." }
      jutsus:
        - { slug: shunshin-no-jutsu }
        - { slug: kage-bunshin-no-jutsu }
      tracos:
        - { nome: Chuva de aço, efeito: "Uma vez por cena, solta o pergaminho inteiro: cada um numa área de 9 m faz uma Resistência de Acrobacia contra a DT 18 e sofre 4d8 de dano, ou metade se passar." }
        - { nome: Arsenal invocado, efeito: "Troca de arma sem gastar ação, quantas vezes quiser no turno." }
        - *recolher
    - nome: Nível Kage
      arte: { formato: pagina, plano: de baixo }
      ameaca: 16
      papel: chefe
      resumo: "Mil armas no ar ao mesmo tempo, e uma lendária na mão."
      ataques:
        - { nome: Arma lendária, alcance: Corpo a corpo, efeito: "Ignora a RD do alvo." }
        - { nome: Arma do arsenal, alcance: Médio }
      jutsus:
        - { slug: shunshin-no-jutsu }
        - { slug: kage-bunshin-no-jutsu }
      tracos:
        - { nome: Mil lâminas, efeito: "Duas vezes por cena, solta o arsenal inteiro: cada um numa área de 12 m faz uma Resistência de Acrobacia contra a DT 20 e sofre 6d8 de dano, ou metade se passar." }
        - { nome: Arsenal invocado, efeito: "Troca de arma sem gastar ação, quantas vezes quiser no turno." }
        - *recolher
  taticas:
    - "Mantém a distância, salta para os lugares altos e cobre o campo de armas. Se alguém chega perto, usa a corrente para prender e se afasta."
  ganchos:
    - "Quer uma arma lendária que um personagem carrega, e oferece trocar por qualquer coisa do arsenal."
    - "Deixou cair um pergaminho com o símbolo de um ferreiro que o grupo conhece."
  tags: [Agressivo, Tático]

- slug: mestre-de-taijutsu
  nome: Mestre de taijutsu
  tipo: shinobi
  origem: Qualquer vila
  vila: null
  arte: { formato: quadro, plano: corpo inteiro }
  cena:
    - "Ele tira os pesos dos tornozelos e os deixa cair. O chão racha onde eles batem. Depois se curva, educado, e no instante seguinte já não está mais onde estava."
  descricao:
    - "Nem todo ninja nasce com talento para o chakra. O mestre de taijutsu trocou os selos de mão pelo próprio corpo, treinado até o limite e além dele. Pesos nas pernas, mil chutes antes do café, um portão interno que se abre quando a luta pede. Corpo a corpo, poucos o igualam."
  estagios:
    - nome: Genin
      arte: { formato: retrato, plano: de ponta-cabeça }
      ameaca: 2
      papel: lutador
      resumo: "Treina dobrado porque não tem talento para o chakra, e ninguém treina mais do que ele."
      ataques:
        - { nome: Sequência de golpes, alcance: Corpo a corpo }
      jutsus:
        - { slug: konoha-reppuu }
        - { slug: konoha-senpuu }
      tracos:
        - &pesos { nome: Pesos, efeito: "Uma vez por cena, solta os pesos: até o fim da cena, a Iniciativa e a Defesa sobem 2." }
    - nome: Chunin
      arte: { formato: quadro, plano: escorço }
      ameaca: 5
      papel: lutador
      resumo: "Já abre os primeiros portões internos e chuta mais rápido do que o olho acompanha."
      ataques:
        - { nome: Sequência de golpes, alcance: Corpo a corpo }
      jutsus:
        - { slug: konoha-senpuu }
        - { slug: dynamic-entry }
        - { slug: konoha-daisenpuu }
      tracos:
        - *pesos
        - { nome: Portões internos, efeito: "Pode abrir até o 2º portão interno, com as regras do cap. 16." }
    - nome: Jounin
      arte: { formato: retrato, plano: perfil }
      ameaca: 8
      papel: lutador
      resumo: "Vai direto no ninja de selos mais perigoso, porque sabe que selo precisa de tempo."
      ataques:
        - { nome: Sequência de golpes, alcance: Corpo a corpo }
      jutsus:
        - { slug: konoha-senpuu }
        - { slug: dynamic-entry }
        - { slug: omote-renge }
        - { slug: konoha-daikaiten }
      tracos:
        - *pesos
        - { nome: Portões internos, efeito: "Pode abrir até o 3º portão interno, com as regras do cap. 16." }
    - nome: Nível Anbu
      arte: { formato: faixa, plano: aéreo }
      ameaca: 11
      papel: lutador
      resumo: "Abre o quinto portão, e a pele fica vermelha de tanto chakra correndo no corpo."
      ataques:
        - { nome: Sequência de golpes, alcance: Corpo a corpo }
      jutsus:
        - { slug: omote-renge }
        - { slug: konoha-daisenpuu }
        - { slug: dynamic-entry }
      tracos:
        - *pesos
        - { nome: Portões internos, efeito: "Pode abrir até o 5º portão interno, com as regras do cap. 16." }
    - nome: Nível Kage
      arte: { formato: pagina, plano: close }
      ameaca: 16
      papel: chefe
      resumo: "Uma lenda dos portões, capaz de lutar de igual para igual com um Kage sem fazer um selo."
      ataques:
        - { nome: Sequência de golpes, alcance: Corpo a corpo }
      jutsus:
        - { slug: omote-renge }
        - { slug: konoha-daisenpuu }
        - { slug: dynamic-entry }
      tracos:
        - *pesos
        - { nome: Portões internos, efeito: "Pode abrir até o 7º portão interno, com as regras do cap. 16." }
        - { nome: Portão da Morte, efeito: "Se tudo estiver perdido, pode abrir o 8º portão, com as regras e o preço do cap. 16." }
  taticas:
    - "Vai direto no ninjutsu mais perigoso do grupo, porque sabe que quem usa selos precisa de tempo. Não usa armas e não aceita ajuda num duelo."
  ganchos:
    - "Desafia o personagem que o venceu no Exame Chunin, anos atrás, e está muito mais forte agora."
    - "Treina crianças sem talento para o chakra numa vila esquecida, e alguém quer fechar a escola."
  tags: [Agressivo, Leal]

- slug: espadachim-da-nevoa
  nome: Espadachim da Névoa
  tipo: shinobi
  origem: Kirigakure
  vila: kiri
  arte: { formato: retrato, plano: corpo inteiro }
  cena:
    - "A espada é maior que ele, e mesmo assim ele a carrega nas costas como quem carrega uma vara de pesca. Ele sorri com dentes afiados quando a névoa começa a subir. Ninguém escuta os passos dele daqui em diante."
  descricao:
    - "Kiri tem uma tradição de espadas, e muitos dos seus ninjas sonham em carregar uma das famosas. O espadachim da névoa vive dessa tradição: lâmina enorme, técnica de matar em silêncio e o gosto pelo duelo. Os melhores carregam uma das espadas lendárias, e os outros matariam por uma."
  estagios:
    - nome: Genin
      arte: { formato: retrato, plano: reflexo }
      ameaca: 2
      papel: lutador
      resumo: "Aprendiz das espadas, que ainda carrega uma lâmina pequena demais para os próprios sonhos."
      ataques:
        - { nome: Espada, alcance: Corpo a corpo }
      jutsus:
        - { slug: kirigakure-no-jutsu-ilusorio }
      tracos:
        - { nome: Filho da névoa, efeito: "Enxerga normalmente dentro da névoa. Para os outros, a névoa segue as regras de encobrimento do cap. 4." }
    - nome: Chunin
      arte: { formato: quadro, plano: por cima do ombro }
      ameaca: 5
      papel: lutador
      resumo: "Já carrega uma lâmina enorme e mata em silêncio dentro da névoa."
      ataques:
        - { nome: Espada grande, alcance: Corpo a corpo }
      jutsus:
        - { slug: kirigakure-no-jutsu-ilusorio }
        - { slug: suijinheki }
      tracos:
        - &assassinato-silencioso { nome: Assassinato silencioso, efeito: "Dentro da névoa, tem vantagem em Furtividade, e o primeiro ataque contra um alvo que não o percebeu é crítico se acertar." }
        - &alcance-lamina { nome: Alcance da lâmina, efeito: "Ataca alvos a até 3 m com a espada." }
    - nome: Jounin
      arte: { formato: retrato, plano: silhueta }
      ameaca: 8
      papel: lutador
      resumo: "Escolhe o alvo pela respiração e só aparece para o duelo com quem achar digno."
      ataques:
        - { nome: Espada grande, alcance: Corpo a corpo }
      jutsus:
        - { slug: kirigakure-no-jutsu-ilusorio }
        - { slug: suijinheki }
        - { slug: sairento-kiringu }
      tracos:
        - *assassinato-silencioso
        - *alcance-lamina
    - nome: Nível Anbu
      arte: { formato: faixa, plano: aéreo }
      ameaca: 11
      papel: lutador
      resumo: "Carrega uma das espadas lendárias da Névoa, e a espada escolheu ele."
      ataques:
        - { nome: Espada lendária, alcance: Corpo a corpo }
      jutsus:
        - { slug: sairento-kiringu }
        - { slug: suiryuudan-no-jutsu }
        - { slug: kirigakure-no-jutsu-ilusorio }
        - { slug: shunshin-no-jutsu }
      tracos:
        - *assassinato-silencioso
        - *alcance-lamina
        - &espada-lendaria { nome: Espada lendária, efeito: "A espada tem um poder, escolhido pelo Mestre: absorver chakra (cada acerto tira 2d6 PC do alvo), beber sangue (recupera metade do dano que causa) ou explodir (o golpe atinge também quem está a até 3 m do alvo)." }
    - nome: Nível Kage
      arte: { formato: pagina, plano: de baixo }
      ameaca: 16
      papel: chefe
      resumo: "O maior espadachim da Névoa, que já carregou mais de uma espada lendária."
      ataques:
        - { nome: Espada lendária, alcance: Corpo a corpo }
      jutsus:
        - { slug: sairento-kiringu }
        - { slug: suiryuudan-no-jutsu }
        - { slug: kirigakure-no-jutsu-ilusorio }
        - { slug: kage-bunshin-no-jutsu }
      tracos:
        - *assassinato-silencioso
        - *alcance-lamina
        - *espada-lendaria
        - { nome: Segunda espada, efeito: "Carrega duas espadas lendárias, com dois poderes diferentes, e ataca com as duas na mesma ação primária." }
  taticas:
    - "Cobre o campo de névoa, some e escolhe o alvo pela respiração. Quando acha um adversário digno, aparece para o duelo."
  ganchos:
    - "Procura uma das Sete Espadas da Névoa e acha que um personagem sabe onde ela está."
    - "Desafia o melhor espadachim do grupo e promete deixar os outros em paz se perder."
  tags: [Agressivo, Brutal]

- slug: marionetista
  nome: Marionetista
  tipo: shinobi
  origem: Sunagakure e os desertores dela
  vila: suna
  arte: { formato: pagina, plano: de baixo }
  cena:
    - "O ninja fica parado no fundo da sala, as mãos erguidas como quem rege uma orquestra. Quem vem para cima do grupo é outra coisa: um boneco de madeira com braços demais, que gira a cabeça sozinho e abre a boca cheia de lâminas."
  descricao:
    - "Os marionetistas nasceram em Suna e se espalharam com os desertores. Lutam de longe, ligados à marionete por fios de chakra quase invisíveis, e escondem nela lâminas, venenos e explosivos. Quem os enfrenta aprende depressa a regra de ouro: não lute com o boneco, procure quem segura os fios."
    - "Os ataques da ficha são os da marionete, que usa a perícia Kugutsu (cap. 13). Os PV e a Defesa de cada marionete estão nos traços: quando ela cai, o marionetista luta com o que sobrou."
  estagios:
    - nome: Genin
      arte: { formato: retrato, plano: de cima }
      ameaca: 2
      papel: atirador
      resumo: "Ainda luta com uma marionete pequena, emprestada da oficina da vila."
      ataques:
        - { nome: Marionete pequena, alcance: Curto }
        - { nome: Kunai, alcance: Corpo a corpo, dano: 1d4+1 }
      jutsus:
        - { slug: kawarimi-no-jutsu }
      tracos:
        - { nome: Marionete pequena, efeito: "PV 30 e Defesa 16. É ela que ataca; o marionetista fica até 30 m atrás, escondido se puder." }
        - &fios { nome: Fios de chakra, efeito: "Enquanto controla uma marionete, tem -2 na Defesa. Quem nota os fios (Percepção contra a DT 22) pode cortá-los (Bukijutsu contra a DT 18), e a marionete cai inerte por 1 turno." }
    - nome: Chunin
      arte: { formato: quadro, plano: escorço }
      ameaca: 5
      papel: atirador
      resumo: "Já tem uma marionete humanoide só sua, com lâminas e veneno escondidos."
      ataques:
        - { nome: Marionete humanoide, alcance: Curto, efeito: "O alvo resiste com VIG contra a DT 15 ou sofre o Veneno Forte (cap. 11)." }
        - { nome: Kunai, alcance: Corpo a corpo, dano: 1d6+1 }
      jutsus:
        - { slug: kawarimi-no-jutsu }
      tracos:
        - { nome: Marionete humanoide, efeito: "PV 60 e Defesa 15, com lâminas ocultas nos braços e um compartimento de veneno." }
        - *fios
    - nome: Jounin
      arte: { formato: retrato, plano: de costas }
      ameaca: 8
      papel: controlador
      resumo: "Rege duas marionetes ao mesmo tempo, uma para atacar e outra para protegê-lo."
      ataques:
        - { nome: Marionetes gêmeas, alcance: Curto, efeito: "O alvo resiste com VIG contra a DT 17 ou sofre o Veneno Forte (cap. 11)." }
        - { nome: Kunai, alcance: Corpo a corpo, dano: 1d6+2 }
      jutsus:
        - { slug: kawarimi-no-jutsu }
        - { slug: kage-bunshin-no-jutsu }
      tracos:
        - { nome: Duas marionetes, efeito: "Duas marionetes humanoides, com PV 60 e Defesa 15 cada. Comanda uma com a ação primária e a outra com a secundária, como no cap. 13." }
        - &escudo-madeira { nome: Escudo de madeira, efeito: "Como reação, uma das marionetes se põe na frente de um ataque contra ele e recebe o golpe." }
        - *fios
    - nome: Nível Anbu
      arte: { formato: faixa, plano: aéreo }
      ameaca: 11
      papel: controlador
      resumo: "Três marionetes e um arsenal de venenos que poucos antídotos curam."
      ataques:
        - { nome: Marionetes de guerra, alcance: Médio, efeito: "O alvo resiste com VIG contra a DT 19 ou sofre o Veneno Letal de Sasori (cap. 11)." }
        - { nome: Kunai, alcance: Corpo a corpo, dano: 1d8+2 }
      jutsus:
        - { slug: kawarimi-no-jutsu }
        - { slug: kage-bunshin-no-jutsu }
      tracos:
        - { nome: Três marionetes, efeito: "Três marionetes humanoides, com PV 60 e Defesa 15 cada; uma delas tem um lança-chamas embutido (cone de fogo, 2d6 de dano, 3 usos por cena)." }
        - *escudo-madeira
        - *fios
    - nome: Nível Kage
      arte: { formato: pagina, plano: emoldurado }
      capa: true
      ameaca: 16
      papel: chefe
      resumo: "O mestre das cem marionetes, que transformou o próprio corpo na mais perigosa delas."
      ataques:
        - { nome: Marionete humana, alcance: Médio, efeito: "O alvo resiste com VIG contra a DT 21 ou sofre o Veneno Letal de Sasori (cap. 11)." }
      jutsus:
        - { slug: kawarimi-no-jutsu }
        - { slug: kage-bunshin-no-jutsu }
        - { nome: Jutsu guardado na marionete, nota: "A marionete humana foi um ninja de verdade e ainda guarda um jutsu dele (cap. 13): escolha um de rank A do catálogo." }
      tracos:
        - { nome: Exército de marionetes, efeito: "Uma vez por cena, solta dezenas de marionetes de uma vez: cada inimigo numa área de 12 m resiste com Acrobacia contra a DT 21 e sofre 6d8 de dano, ou metade se passar." }
        - { nome: Corpo de marionete, efeito: "Não sente dor, não sangra e é imune a **Envenenado**. Só um núcleo escondido no peito ainda é vivo, e um acerto crítico contra ele o derruba na hora." }
        - *escudo-madeira
  taticas:
    - "Fica longe, escondido, e deixa a marionete lutar. Se alguém chega perto dele, recua por trás dela e usa a reação para bloquear."
    - "Quando a marionete cai, foge se puder. Se não puder, luta com a kunai, e luta mal."
  ganchos:
    - "A marionete que ele usa foi feita a partir de alguém que o grupo procurava."
    - "Um marionetista desertor de Suna vende marionetes armadas a bandidos da estrada."
    - "Uma oficina abandonada no deserto guarda marionetes que ainda se mexem sozinhas (veja o verbete Marionete abandonada)."
  tags: [Tático, Cauteloso]

- slug: guarda-costas
  nome: Guarda-costas
  tipo: shinobi
  ameaca: 5
  papel: lutador
  origem: Contratado por nobres e mercadores
  vila: null
  arte: { formato: quadro, plano: de baixo }
  cena:
    - "O mercador sorri do alto do palanquim. Ao lado dele, o guarda-costas não sorri: só dá meio passo para a frente, entre o patrão e o grupo, e cruza os braços enormes."
  descricao:
    - "Daimyō, mercadores e nobres pagam bem para dormir em paz, e os guarda-costas ninjas existem para isso. São leais a quem paga, treinados para receber o golpe no lugar do cliente e para nunca deixar a luta chegar perto dele."
  ataques:
    - { nome: Bastão de ferro, alcance: Corpo a corpo }
  jutsus:
    - { slug: kawarimi-no-jutsu }
    - { slug: doryuuheki }
  tracos:
    - { nome: Escudo humano, efeito: "Como reação, quando o protegido ao lado dele é atacado, o guarda-costas recebe o ataque no lugar." }
  taticas:
    - "Não persegue ninguém. Fica colado no cliente, bloqueia quem chega perto e o tira dali na primeira chance."
  ganchos:
    - "O cliente dele é o alvo da missão do grupo, e o guarda-costas é um velho amigo de alguém da equipe."
    - "Não recebe há três meses e está pensando em mudar de lado."
  tags: [Leal, Cauteloso]

- slug: portador-da-marca
  nome: Portador da marca amaldiçoada
  tipo: shinobi
  origem: Laboratórios e esconderijos
  vila: null
  arte: { formato: pagina, plano: close de baixo }
  cena:
    - "As marcas começam no pescoço, pequenas como manchas de tinta. Depois se espalham pela pele como chamas pretas, e o ninja ri, um riso que não parece dele. O ar em volta fica pesado de chakra."
  descricao:
    - "Alguém, em algum esconderijo, aprendeu a marcar ninjas com um selo que dá força em troca de pedaços da alma. O portador sente o poder chamando o tempo todo. Quanto mais usa, mais forte fica, e menos sobra de quem ele era antes."
  estagios:
    - nome: Marca adormecida
      ameaca: 4
      papel: lutador
      resumo: "A marca ainda está quieta no pescoço. Por enquanto."
      ataques:
        - { nome: Kunai, alcance: Corpo a corpo }
      jutsus:
        - { slug: goukakyu-no-jutsu }
      tracos:
        - { nome: Despertar, efeito: "Abaixo da metade dos PV, a marca pode despertar: o portador passa a usar a ficha da marca desperta até o fim da cena e, depois dela, ganha um nível de Fadiga." }
    - nome: Marca desperta
      ameaca: 8
      papel: lutador
      resumo: "As chamas pretas cobrem metade do corpo, e o chakra pesa no ar."
      ataques:
        - { nome: Golpe da marca, alcance: Corpo a corpo }
      jutsus:
        - { slug: goukakyu-no-jutsu }
        - { slug: karyuu-endan }
      tracos:
        - { nome: Fúria do selo, efeito: "Ignora a primeira condição que sofrer em cada cena." }
        - { nome: Preço, efeito: "No fim da cena, ganha um nível de Fadiga." }
    - nome: Segunda forma
      ameaca: 12
      papel: chefe
      resumo: "A pele escurece, o cabelo cresce e asas de carne rasgam as costas."
      ataques:
        - { nome: Garras da segunda forma, alcance: Corpo a corpo }
      jutsus:
        - { slug: karyuu-endan }
        - { slug: chidori }
      tracos:
        - { nome: Asas, efeito: "Voa." }
        - { nome: Preço, efeito: "No fim da cena, ganha dois níveis de Fadiga. Se chegar ao nível 5, o corpo não aguenta." }
  taticas:
    - "Luta normalmente até sentir dor. Aí a marca acorda, e ele para de pensar em tática: só quer destruir quem o feriu."
  ganchos:
    - "O portador é um amigo de infância de alguém do grupo, que aceitou a marca para salvar a família."
    - "Quem dá as marcas está recrutando jovens no Exame Chunin."
  tags: [Agressivo, Fanático]

- slug: jinchuuriki
  nome: Jinchuuriki
  tipo: shinobi
  origem: Qualquer grande vila
  vila: null
  arte: { formato: pagina, plano: de baixo }
  cena:
    - "O chakra vermelho sobe da pele dele como fumaça, e as pupilas viram fendas. O chão em volta racha. Ele ainda está tentando falar alguma coisa para o grupo quando a voz deixa de ser a dele."
  descricao:
    - "O jinchuuriki carrega uma das nove Bestas com Cauda selada dentro do corpo, quase sempre desde criança. A vila o trata como arma e como ameaça, e ele cresce temido e sozinho, enquanto a besta espera cada momento de raiva para sair. Quanto mais ela sai, menos dele sobra."
    - "Escolha qual das nove bestas ele carrega (veja o verbete Bestas com Cauda): ela dá o sabor do chakra, da areia de Shukaku ao fogo azul de Matatabi, e é a ficha dela que vale quando a transformação se completa."
  estagios:
    - nome: Chakra vazando
      ameaca: 6
      papel: lutador
      resumo: "O chakra da besta escapa pela pele, vermelho e quente."
      ataques:
        - { nome: Golpe selvagem, alcance: Corpo a corpo }
      jutsus:
        - { slug: kage-bunshin-no-jutsu }
      tracos:
        - { nome: Regeneração, efeito: "No começo de cada turno, recupera 5 PV." }
    - nome: Manto de uma cauda
      ameaca: 9
      papel: lutador
      resumo: "Um manto de chakra com orelhas e uma cauda cobre o corpo."
      ataques:
        - { nome: Garras de chakra, alcance: Curto }
      tracos:
        - { nome: Regeneração, efeito: "No começo de cada turno, recupera 10 PV." }
        - { nome: Manto que queima, efeito: "Quem o acerta corpo a corpo sofre 1d6 de dano." }
    - nome: Manto de várias caudas
      ameaca: 13
      papel: chefe
      resumo: "A pele some sob o chakra, as caudas se multiplicam e a besta quase toma conta."
      ataques:
        - { nome: Braços de chakra, alcance: Médio }
      tracos:
        - { nome: Regeneração, efeito: "No começo de cada turno, recupera 15 PV." }
        - { nome: Manto que queima, efeito: "Quem o acerta corpo a corpo sofre 2d6 de dano." }
        - { nome: Transformação completa, efeito: "Se cair abaixo de um quarto dos PV, a besta sai inteira: a partir do turno seguinte, use a ficha dela no verbete Bestas com Cauda." }
        - { nome: Selamento, efeito: "Com o jinchuuriki **Imobilizado**, um teste de Selamento contra a DT 19 empurra a besta de volta e encerra o manto." }
  taticas:
    - "No começo, tenta se segurar e às vezes pede que o grupo fuja. Depois que a besta toma conta, ataca tudo o que se move."
  ganchos:
    - "O jinchuuriki fugiu da própria vila, e as duas vilas vizinhas o querem: uma para proteger, outra para usar."
    - "Uma organização caça jinchuuriki, e o próximo da lista está na vila do grupo."
  tags: [Brutal, Fanático]

- slug: conselheiro
  nome: Conselheiro da vila
  tipo: shinobi
  ameaca: 8
  papel: controlador
  origem: O conselho de uma grande vila
  vila: null
  arte: { formato: quadro, plano: de baixo }
  cena:
    - "Atrás da mesa baixa, a velha senhora ajeita os óculos e desenrola o pergaminho com a missão. Não olha para o grupo enquanto fala. Na parede de papel atrás dela, as sombras de outros dois conselheiros concordam com a cabeça ao mesmo tempo."
  descricao:
    - "Os conselheiros são os antigos companheiros de equipe do Kage, jounin que lutaram nas guerras e agora lutam na sala do conselho. Aconselham, vetam, sussurram ao daimyō e, às vezes, governam de verdade. Ainda sabem lutar, e conhecem os segredos de todo mundo na vila."
  ataques:
    - { nome: Bengala de ferro, alcance: Corpo a corpo }
  jutsus:
    - { slug: kai }
    - { slug: magen-jubaku-satsu }
    - { slug: doryuuheki }
  tracos:
    - { nome: Voz do conselho, efeito: "Uma vez por cena, chama a guarda: aparecem dois chunin da vila dele (a ficha Chunin do verbete da vila, como Shinobi de Konoha), que agem na iniciativa dele." }
    - { nome: Velha raposa, efeito: "Nunca fica **Desprevenido** e tem vantagem para perceber mentiras." }
  taticas:
    - "Não luta se puder mandar alguém lutar. Se for atacado, prende o agressor numa ilusão e espera a guarda."
  ganchos:
    - "O conselho quer o grupo fora da vila, e vai usar a lei para isso."
    - "Um conselheiro pede ajuda ao grupo, escondido do Kage e dos outros conselheiros."
  tags: [Diplomata, Cauteloso]
