- slug: kage-mane-no-jutsu
  nome: Kage Mane no Jutsu
  traducao: Técnica de Imitação da Sombra
  origem: Clã Nara
  tipo: Ninjutsu
  rank: C
  custo: 8 PC
  info:
    - k: Alcance
      v: Médio (30m)
    - k: Duração
      v: Sustentado (2 PC/turno por alvo)
    - k: Área
      v: Alvo único (+2 PC por alvo adicional, máx. 3)
    - k: Ataque
      v: 1d20 + Ninjutsu
    - k: Resistência
      v: FOR (DT do Jutsu) ao fim de cada turno
    - k: Ação
      v: Primária
  descricao:
    - O usuário expande a própria sombra até alcançar a sombra dos alvos, que passam a reproduzir todos os movimentos do Nara — passo a passo, gesto por gesto. Não pode ser usada em áreas sem sombras.
  efeito: "Os alvos atingidos ficam Controlados: repetem os movimentos do usuário e não agem por conta própria. Ao fim de cada turno, cada alvo pode tentar se libertar com Resistência de FOR."
  notas:
    - Enquanto mantém a técnica, o usuário só se move junto com os alvos e faz ações secundárias.
  pj: controle por imitação (4) + Médio (2) + sustentado (2) = 8 → Rank C.
  capitulo: 8
  ancora: jutsus-e-habilidades-do-cla
  cla: nara
  elemento: null
